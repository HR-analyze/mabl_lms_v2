# Правила раздачи МАБЛ LMS: заголовки безопасности, маршруты приложения,
# статика фронтенда, SPA-fallback.
#
# Файл подключается из server-блока (см. nginx-mabl-lms.conf) и намеренно НЕ
# содержит ни listen, ни server_name, ни ssl_* — то есть ничего, что относится
# к конкретному домену и сертификату. Поэтому его можно перезаписывать при
# каждом обновлении, не рискуя снести TLS-секцию, которую дописал certbot:
#
#   sudo cp deploy/mabl-lms-app.conf /etc/nginx/snippets/mabl-lms-app.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Именно ради этого правила вынесены в отдельный файл: раньше они жили в общем
# конфиге, и копирование его из репозитория затирало и домен, и сертификат —
# сайт переставал открываться.

# Потолок размера загружаемого файла. Должен быть не меньше MAX_UPLOAD_MB
# в /etc/mabl-lms.env, иначе nginx отрежет запрос раньше приложения.
client_max_body_size 256m;

# Сжатие текстовых ответов.
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;
gzip_min_length 1024;

# ---------- заголовки безопасности ----------
# always — чтобы заголовки ставились и на ответах с ошибкой (4xx/5xx).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HSTS имеет смысл только поверх HTTPS и начинает работать после выпуска
# сертификата (certbot добавит блок listen 443).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), fullscreen=(self)" always;
# Политика пока в режиме наблюдения: нарушения только сообщаются, ничего не
# блокируется. Перед переводом в боевой режим (Content-Security-Policy)
# проверьте отчёты — SCORM-пакеты часто тянут инлайновые скрипты.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self'; connect-src 'self' https:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri /api/csp-report" always;

# ---------- приложение ----------
# /scorm/ тоже уходит в приложение: там лежат пакеты из репозитория, и отдавать
# их статикой нельзя — проверка оплаты живёт в приложении, а до него запрос при
# прямой раздаче не доходил, то есть платный курс скачивал любой, кто знал адрес.
location ~ ^/(api|scorm-store|scorm|files|healthz)(/|$) {
    # add_header внутри location отменяет заголовки уровня server, поэтому
    # нужные повторяются здесь. CSP для SCORM намеренно не ставится: пакеты
    # iSpring и Articulate работают на инлайновых скриптах.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_pass http://mabl_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Загрузка больших файлов: не буферизуем тело и даём время на передачу.
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# ---------- статика фронтенда ----------
# Ассеты с хэшем в имени можно кэшировать навсегда.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# ---------- SPA ----------
# Любой неизвестный путь отдаёт index.html — дальше маршрутизирует React Router.
location / {
    try_files $uri $uri/ /index.html;
}

location = /index.html {
    add_header Cache-Control "no-cache";
}
