# nginx для МАБЛ LMS.
#
#   /api/*          → приложение Node (порт 3000)
#   /scorm-store/*  → приложение Node (файлы SCORM-пакетов, после проверки оплаты)
#   /scorm/*        → приложение Node (пакеты из репозитория, туда же)
#   /files/*        → приложение Node (файлы учебных материалов)
#   всё остальное   → статика собранного фронтенда, SPA-fallback на index.html
#
# Сами правила раздачи лежат в отдельном файле mabl-lms-app.conf и
# подключаются ниже одной строкой include.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ ВНИМАНИЕ. Этот файл — ОДНОРАЗОВЫЙ ШАБЛОН, а не то, что копируют при     │
# │ каждом обновлении.                                                      │
# │                                                                         │
# │ В нём живут домен (server_name) и, после выпуска сертификата, TLS-секция │
# │ от certbot (listen 443, ssl_certificate). Копирование поверх рабочего    │
# │ конфига затрёт и то и другое: домен перестанет совпадать, 443-й порт     │
# │ уйдёт в чужой server-блок — и сайт откроется чужой страницей с ошибкой   │
# │ сертификата. Ровно это и случилось однажды.                             │
# │                                                                         │
# │ Обновляете правила раздачи — копируйте ТОЛЬКО mabl-lms-app.conf:         │
# │   sudo cp deploy/mabl-lms-app.conf /etc/nginx/snippets/mabl-lms-app.conf │
# │   sudo nginx -t && sudo systemctl reload nginx                          │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Первая установка (один раз):
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/mabl-lms-app.conf /etc/nginx/snippets/mabl-lms-app.conf
#   sudo cp deploy/nginx-mabl-lms.conf /etc/nginx/sites-available/mabl-lms
#   sudo ln -sf /etc/nginx/sites-available/mabl-lms /etc/nginx/sites-enabled/mabl-lms
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (тоже один раз; certbot сам допишет listen 443 и редирект с 80):
#   sudo certbot --nginx -d course.mabl.ru
#
# Если TLS-секцию всё же затёрли — сертификат при этом цел, он лежит в
# /etc/letsencrypt и nginx его не трогает. Достаточно вернуть верный
# server_name и повторить команду certbot выше.

upstream mabl_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    # ЗАМЕНИТЕ на свой домен, если он другой. Значение должно совпадать с тем,
    # на который выпущен сертификат, иначе запросы уйдут в дефолтный
    # server-блок — возможно, вообще другого приложения на этой машине.
    server_name course.mabl.ru;

    # Корень собранного фронтенда (результат `npm run build:client`).
    root /srv/mabl-lms/dist;
    index index.html;

    access_log /var/log/nginx/mabl-lms.access.log;
    error_log  /var/log/nginx/mabl-lms.error.log;

    # Заголовки безопасности, маршруты приложения, статика, SPA-fallback.
    include /etc/nginx/snippets/mabl-lms-app.conf;
}
